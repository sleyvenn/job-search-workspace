<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#191919">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · Applications</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script src="/icons.js" defer></script>
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand" id="login-icon" aria-hidden="true"></div>
    <p class="login-eyebrow" id="brand-name">PRIVATE WORKSPACE</p>
    <h1>Applications</h1>
    <p class="login-intro">Your job search, in one place.</p>
    <div class="login-access">
      <h2>Sign in with Telegram</h2>
      <p>Receive a code in Telegram. No password needed.</p>
      <button type="button" class="small-button primary login-request" id="request-code">Send code to Telegram</button>
      <form id="code-form" hidden>
        <label for="code">Six-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
        <button type="submit" id="verify-code" class="small-button primary">Sign in</button>
      </form>
      <p id="login-status" role="status" aria-live="polite"></p>
    </div>
    <p class="login-footnote">Private access · Stay signed in for up to 30 days on this browser.</p>
  </main>
</body>
</html>
